name: CI

on:
  pull_request:
    branches: [master]

jobs:
  typecheck-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:tema

      - run: npm run test:agenda

      - run: npm run tema:comprobar

      - run: npm run build
