schema: spec-driven

context: |
  Sistema de Gestión de Citas e Historias Clínicas Electrónicas para una clínica en Perú.
  Reemplaza Excel + Google Forms (citas) y papel (historias clínicas). Estado: sin código de
  aplicación aún — docs/PRD.md, docs/TECH-DESIGN.md y docs/adrs/ ya existen y son la fuente de verdad. Antes de
  proponer un cambio, léelos (CLAUDE.md los resume pero no los sustituye).

  Stack decidido (no reabrir): Next.js 15 (App Router) + TypeScript en Vercel, Neon (Postgres
  serverless) con Neon RLS Authorize (pg_session_jwt + JWT de Clerk) para el contexto de usuario,
  Clerk (auth/sesión/MFA), Vercel Blob (adjuntos clínicos), Resend + Vercel Cron (notificaciones,
  solo email). Detalle en TECH-DESIGN.md y ADR 0020-0028.

  Roles e invariante central (no reabrir sin pedido del cliente):
    - Administrativo (recepción): registra al paciente nuevo (con o sin cita) y abre su historia con la
      filiación de la NTS 139; agenda/reprograma/cancela citas de cualquier paciente; entrega la copia de la
      historia verificando la identidad de quien la pide.
    - Profesional de la salud (PRD 2026-10-11; reemplaza a «Médico»; médico, odontólogo, fisioterapeuta,
      psicólogo, podólogo; ADR-0030 propuesta: hasta aceptarla el esquema y el código vigentes usan `medico`):
      ve sus turnos y citas; registra/consulta historias clínicas SOLO de sus pacientes a cargo (aislamiento por
      RLS en base de datos, no solo en capa de aplicación); la historia es compartida entre especialidades
      SALVO la información de Psicología (ADR-0031 propuesta); deriva a otra especialidad; receta solo si su
      profesión puede recetar.
    - Enfermera: registra el triaje y deriva a una especialidad; consulta su turno y con qué especialidad
      trabaja. SIN acceso a historias clínicas.
    - Paciente: reserva/cancela SU propia cita vía portal de autoservicio. Sin acceso a historias
      clínicas ni funciones administrativas.

  Reglas de negocio obligatorias:
    - Doble reserva: constraint en BD (a prueba de concurrencia) + mensaje exacto
      "Registro de cita ya agendado".
    - Cancelación: bloqueada dentro de la 1 hora previa a la cita, para TODOS los roles incluido
      administrativo (ADR-0012). Advertir de esta ventana al momento de reservar.
    - Historia clínica: nunca con campos vacíos o datos inválidos; los datos que vienen del
      registro del paciente son de solo lectura desde la historia clínica.
    - Profesional de baja o emergencia: reasignación de sus citas a otro de la misma especialidad (flujo explícito).
    - Notificación automática al paciente un día antes de la cita (email vía Resend/cron).
    - Identificación de paciente: valida DNI y Carné de Extranjería, no solo DNI; la NTS 139 admite además
      pasaporte (extranjero en tránsito) y número correlativo provisional (sin documento).
    - Apertura de la historia: una historia única por paciente, con el formato de filiación mínimo de la NTS 139.
    - Pacientes sin cita: la enfermera hace el triaje y deriva a una especialidad; derivar no da acceso por sí
      solo, un profesional de la especialidad «toma» al paciente (ADR-0032 propuesta).
    - Triaje: presión arterial, frecuencia cardíaca, frecuencia respiratoria, temperatura, saturación de
      oxígeno, peso y talla (IMC calculado).
    - Recetas: solo común impresa, numerada, con datos estructurados; inmutable (se anula y se emite otra). Sin
      receta electrónica ni especial, sin alertas automáticas de interacción.
    - Copia de la historia (NTS 139): máximo 5 días, identidad del solicitante verificada, quién emite registrado;
      incluye la información de Psicología.

  Decisión abierta que SÍ bloquea (no inventar respuesta, preguntar): marco legal peruano de
  historia clínica electrónica (NTS del MINSA) — retención, firma electrónica vs. firma lógica,
  y si los datos clínicos pueden alojarse fuera de Perú; además la acreditación del sistema ante el MINSA
  (DS 009-2017-SA, Directiva 373-MINSA/OGTI-2025), el registro del banco de datos ante la ANPD y las reglas de
  salud mental (ver docs/investigacion-marco-legal-y-saniape.md). Bloquea producción del módulo de
  historias clínicas. Lista completa de riesgos abiertos en "Riesgos técnicos abiertos" de
  TECH-DESIGN.md.

  Fuera de alcance de esta versión — no proponerlo: pagos/facturación en línea (incluidos presupuestos y cuotas),
  telemedicina, integración con laboratorios o farmacias, inventario, multi-sede, reportes/analítica de BI,
  receta electrónica y especial, alertas automáticas de interacción de medicamentos, WhatsApp y SMS, dictado por
  voz e IA, la especialidad de Estética y Capilar y el acceso del paciente a su historia desde el portal.

  Convenciones: UI, documentación y mensajes de error en español. Fechas siempre timestamptz en
  BD, renderizadas en America/Lima. Migraciones en migrations/*.sql (node-pg-migrate), solo hacia
  adelante, nunca cambios manuales en producción ni restore del branch principal de Neon. Toda
  tabla nueva en `public` nace con RLS activada y su prueba pgTAP negativa (rol equivocado no ve
  el dato).

  Hoja de ruta sugerida (TECH-DESIGN.md, "Plan de implementación sugerido") — úsala para
  secuenciar los changes salvo que el cliente pida otro orden:
    H1 esqueleto (Next.js/Vercel/Neon/Clerk/roles/CI) → H2 esquema + RLS + pgTAP → H3 agenda y
    reserva (panel administrativo) → H4 portal del paciente → H5 notificaciones → H6 historias
    clínicas (bloqueado por la decisión legal) → H7 turnos de enfermería y dashboard → H8
    migración de datos y capacitación.
  Hitos añadidos por el PRD del 2026-10-11 (el orden fino lo fija docs/BACKLOG.md): H2c
    profesionales-de-la-salud (antes de H3), H6b triaje-y-derivacion, H6c recetas-medicas, H6d
    copia-de-historia-clinica, H6e especialidad-odontologia, H6f especialidad-fisioterapia, H6g
    especialidad-psicologia y H6h especialidad-podologia (las cinco especialidades se entregan juntas;
    Medicina general es la plantilla de H6, ADR-0029).

rules:
  proposal:
    - Indicar a qué hito (H1-H8) de TECH-DESIGN.md corresponde el cambio, o justificar por qué
      queda fuera de esa secuencia.
    - Si el cambio toca acceso a historias clínicas o RLS, decirlo explícitamente en el
      proposal — es el riesgo principal declarado del proyecto y merece revisión aparte.
    - Si el cambio depende de la decisión legal peruana aún abierta (historia clínica), decirlo
      y dejar claro que no puede pasar a producción hasta resolverse.
    - Referenciar el/los ADR relevantes si la decisión de diseño ya está tomada; si el cambio
      requiere una decisión de arquitectura nueva, no la decidas dentro del proposal — créala
      como ADR aparte (skill `architecture`) y linkéala.
  specs:
    - Redactar en español, igual que PRD.md, TECH-DESIGN.md y los ADR.
    - Todo requisito que dependa de RLS debe incluir explícitamente el caso negativo (qué rol NO
      debe poder ver el dato).
  tasks:
    - Toda tabla nueva en el esquema `public` incluye como tarea explícita su prueba pgTAP
      negativa, no solo la migración.
    - Las migraciones son archivos nuevos en migrations/*.sql; nunca editar una migración ya
      aplicada.

operations:
  apply:
    guidance:
      - No implementar el módulo de historias clínicas en modo apto para producción mientras la
        decisión legal (NTS MINSA) siga abierta; si se construye en paralelo, dejarlo detrás de
        un entorno/flag que impida datos clínicos reales. Los datos sintéticos de demostración
        (proyecto de muestra) sí se permiten; los reales, no.
      - Antes de cerrar una tarea que crea una tabla nueva, confirmar que RLS quedó activada y
        que existe su prueba pgTAP negativa.
  archive:
    guidance:
      - Al sincronizar specs, verificar que no contradigan CLAUDE.md ni los ADR vigentes; si el
        cambio reabre algo ya decidido, marcarlo para revisión humana en vez de sobreescribirlo
        en silencio.
